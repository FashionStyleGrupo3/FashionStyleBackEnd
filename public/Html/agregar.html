<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agregar Producto - Fashion Style</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../CSS/inventario.css">
  <link rel="stylesheet" href="../CSS/responsive.css">
  <link rel="stylesheet" href="../CSS/tallas_medidas.css">
  <link rel="stylesheet" href="../CSS/asistente-ia.css?v=2">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

  <nav class="navbar">
    <a href="#" class="logo-link">
      <img src="../assets/logo.pp.png" alt="FashionStyle Logo" class="logo">
    </a>
    <div class="navbar-links">
      <a href="Inventario.html">Inventario</a>
      <a href="VistaPrevia.html">Vista Previa</a>
    </div>
    <a href="VistaPrevia.html" class="btn-volver">← Volver</a>
  </nav>

  <div class="page-bg"></div>

  <div class="page-content">
    <div class="page-header">
      <h1>AGREGAR NUEVO PRODUCTO</h1>
      <div class="underline-accent"></div>
      <p>Registra prendas para el catálogo Fashion Style</p>
    </div>

    <div class="form-card">

      <!-- ── Columna imagen ── -->
      <div class="upload-col">
        <span class="upload-col-title">Imagen del producto</span>
        <div class="image-drop-zone" onclick="document.getElementById('imagen').click()">
          <img id="previewImg" alt="Vista previa">
          <div class="drop-placeholder" id="dropPlaceholder">
            <div class="drop-icon">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                <circle cx="12" cy="13" r="4"/>
              </svg>
            </div>
            <span>Vista previa</span>
          </div>
        </div>
        <input type="file" id="imagen" accept="image/*" class="input-oculto">
        <button class="btn-elegir" type="button" onclick="document.getElementById('imagen').click()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          Elegir archivo
        </button>
        <p class="upload-hint">Formatos permitidos: JPG, PNG, WEBP<br>Tamaño máximo: 5MB</p>
      </div>

      <!-- ── Columna campos ── -->
      <div class="fields-col">

        <div class="field-group">
          <label for="nombre">Nombre del producto</label>
          <input id="nombre" type="text" placeholder="Ej: Camiseta T-ZUN">
        </div>

        <div class="fields-row">
          <div class="field-group">
            <label for="precio">Precio</label>
            <input id="precio" type="number" placeholder="Ej: 85000">
          </div>
          <div class="field-group">
            <label for="color">Color</label>
            <input id="color" type="text" placeholder="Ej: Negro">
          </div>
        </div>

        <div class="field-group">
          <label for="desc">Descripción</label>
          <textarea id="desc" placeholder="Detalles de la prenda..."></textarea>
        </div>

        <!-- ── Tallas ── -->
        <div class="field-group">
          <label>
            Tallas <span class="campo-obligatorio">* agrega al menos una</span>
          </label>
          <div id="listaTallas" class="lista-tallas"></div>
          <button class="btn-agregar-talla" type="button" id="btnAgregarTalla">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            Agregar talla
          </button>
        </div>

        <button class="btn-guardar" type="button" onclick="agregarProducto()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
            <polyline points="17 21 17 13 7 13 7 21"/>
            <polyline points="7 3 7 8 15 8"/>
          </svg>
          Guardar Producto
        </button>

      </div>
    </div>
  </div>

  <!-- ── Template: fila de talla con stock y medidas ── -->
  <template id="tplFilaTalla">
    <div class="fila-talla">
      <div class="fila-talla-header">
        <input type="text" class="talla-nombre" placeholder="Talla (Ej: S, M, L, 40)">
        <div class="talla-stock-grupo">
          <label>Stock</label>
          <input type="number" class="talla-stock" placeholder="0" min="0" value="0">
        </div>
        <button type="button" class="btn-quitar-talla" title="Quitar esta talla">✕</button>
      </div>
      <div class="fila-talla-medidas">
        <div class="medida-campo">
          <label>Hombro</label>
          <input type="text" class="medida-hombro" placeholder="Ej: 40 cm">
        </div>
        <div class="medida-campo">
          <label>Pecho</label>
          <input type="text" class="medida-pecho" placeholder="Ej: 92 cm">
        </div>
        <div class="medida-campo">
          <label>Cintura</label>
          <input type="text" class="medida-cintura" placeholder="Ej: 76 cm">
        </div>
        <div class="medida-campo">
          <label>Cadera</label>
          <input type="text" class="medida-cadera" placeholder="Ej: 98 cm">
        </div>
        <div class="medida-campo">
          <label>Largo</label>
          <input type="text" class="medida-largo" placeholder="Ej: 110 cm">
        </div>
        <div class="medida-campo">
          <label>Largo de manga</label>
          <input type="text" class="medida-largo-manga" placeholder="Ej: 60 cm">
        </div>
      </div>
    </div>
  </template>

  <script src="../JS/sesion.js"></script>
  <script src="../JS/funcionPrograma.js"></script>
  <script src="../JS/asistente-ia.js"></script>
</body>
</html>
